[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aurevion-knowledge-lab"
version = "0.1.0"
description = "A reproducible GraphRAG notebook linking research passages to reviewable product decisions."
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "graphrag==3.3.0",
  "matplotlib>=3.10,<4",
  "pyvis==0.3.2",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6.29,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
