# Reference configuration for GraphRAG 3.3.0; make_config creates isolated absolute paths.
# No model compatibility or cost is established by validating this file.
completion_models:
  default_completion_model:
    model_provider: gemini
    model: gemini-3.1-flash-lite
    api_key: ${GEMINI_API_KEY}
    call_args: {temperature: 0, max_tokens: 2048, timeout: 60}
    retry: {type: exponential_backoff, max_retries: 2, base_delay: 2, max_delay: 10}
embedding_models:
  default_embedding_model:
    model_provider: gemini
    model: gemini-embedding-001
    api_key: ${GEMINI_API_KEY}
    call_args: {dimensions: 3072, timeout: 60}
    retry: {type: exponential_backoff, max_retries: 2, base_delay: 2, max_delay: 10}
concurrent_requests: 1
async_mode: asyncio
chunking: {type: tokens, size: 600, overlap: 80, encoding_model: o200k_base}
input_storage: {type: file, base_dir: input}
output_storage: {type: file, base_dir: output}
update_output_storage: {type: file, base_dir: update_output}
reporting: {type: file, base_dir: logs}
cache:
  type: json
  storage: {type: file, base_dir: cache}
vector_store: {type: lancedb, db_uri: lancedb, vector_size: 3072}
embed_text: {names: [entity_description, text_unit_text], batch_size: 8}
extract_graph:
  entity_types: [intervention, outcome, population, nutrient, exercise, study]
  max_gleanings: 0
extract_claims: {enabled: false}
community_reports: {max_length: 600, max_input_length: 4000}
local_search: {max_context_tokens: 4000, top_k_entities: 5, top_k_relationships: 5}
basic_search: {max_context_tokens: 4000, k: 5}
